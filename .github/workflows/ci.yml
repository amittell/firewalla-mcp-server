name: CI

# A change to these alone runs nothing. No job reads them: format:check
# covers src/ only, so a Markdown file there still runs CI. Run the
# workflow by hand to check one anyway.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # engines.node is >=18.0.0; geoip-lite 2.x declares >=24 for its
        # database update script, but its lookups run on all of these
        node: ['18', '20', '22', '24']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci

    # Fails on a high or critical advisory in a dependency the package ships;
    # dev dependencies (jest, eslint, ...) are not installed by users
    - name: Audit production dependencies
      if: matrix.node == '24'
      run: npm audit --audit-level=high --omit=dev
    
    - name: Lint
      if: matrix.node == '24'
      run: npm run lint

    - name: Format
      if: matrix.node == '24'
      run: npm run format:check
    
    - name: Build
      run: npm run build

    # ts-jest only transpiles tests (isolatedModules in tsconfig.test.json)
    # and the build's tsconfig.json leaves out tests/, so this is the one
    # step that type checks them
    - name: Type check tests
      run: npm run typecheck:tests
    
    - name: Tests
      # The whole suite: test:quick covered only utils and validation, so the
      # tool, server, client and search tests never ran in CI
      run: npm test -- --watchAll=false
      env:
        CI: true
        NODE_ENV: test

  launch:
    name: Launch (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # A pull request launches on Linux; a push to main and a run by hand
        # also launch on macOS and Windows, whose runners cost the most
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') }}
        node: ['18', '24']

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build

    - name: Pack
      id: pack
      shell: bash
      run: echo "tarball=$(npm pack --silent | tail -n 1)" >> "$GITHUB_OUTPUT"

    - name: Answer initialize through the global bin, npx and node dist/server.js
      run: node scripts/launch-smoke.mjs "${{ steps.pack.outputs.tarball }}"
