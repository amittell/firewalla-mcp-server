name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Lint
      run: npm run lint
    
    - name: Build
      run: npm run build
    
    - name: Core Tests
      run: npm run test:quick
      env:
        CI: true
        NODE_ENV: test

  launch:
    name: Launch (${{ matrix.os }}, Node 24)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build

    - name: Pack
      id: pack
      shell: bash
      run: echo "tarball=$(npm pack --silent | tail -n 1)" >> "$GITHUB_OUTPUT"

    - name: Answer initialize through the global bin, npx and node dist/server.js
      run: node scripts/launch-smoke.mjs "${{ steps.pack.outputs.tarball }}"
