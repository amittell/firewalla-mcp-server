name: Publish to npm

# Adapted from amittell/openclaw-scheduler's publish.yml. A `v*` tag on a commit
# in main publishes with provenance through npm trusted publishing (OIDC, no
# NPM_TOKEN secret); a second job waits for the version on the registry,
# verifies its signatures and attestations, and creates the GitHub release
# from CHANGELOG.md.
# Needs firewalla-mcp-server configured as a trusted publisher on npmjs.com for
# this repository and workflow file.

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify (Linux / Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tagged commit is contained in main
        run: |
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          TAG_COMMIT="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          if ! git merge-base --is-ancestor "$TAG_COMMIT" refs/remotes/origin/main; then
            echo "Tag $GITHUB_REF_NAME points to $TAG_COMMIT, which is not contained in origin/main"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify dependency signatures
        run: npm audit signatures

      - name: Lint, build and test
        run: |
          npm run lint:check
          npm run build
          npm run test:ci

  publish:
    name: Publish
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tagged commit is contained in main
        run: |
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          TAG_COMMIT="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          if ! git merge-base --is-ancestor "$TAG_COMMIT" refs/remotes/origin/main; then
            echo "Tag $GITHUB_REF_NAME points to $TAG_COMMIT, which is not contained in origin/main"
            exit 1
          fi

      - name: Require successful main CI for tagged commit
        # A docs-only tag commit can have no CI run of its own (ci.yml
        # ignores docs-only pushes); the script then requires the run of the
        # nearest ancestor that has one, past docs-only commits only
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/require-main-ci.sh "$(git rev-list -n 1 "$GITHUB_REF_NAME")" 1800

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p 'require("./package.json").version')"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Check release notes in CHANGELOG.md
        run: bash scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > /dev/null

      - name: Publish
        run: npm publish --access public --provenance

  release:
    # A job of its own so that a registry slower than the wait can be
    # retried with `gh run rerun <run-id> --failed`, which reruns this job
    # and not the publish, which cannot publish the same version twice
    name: Verify published package and release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Verify published package signatures and provenance
        run: bash scripts/verify-published.sh "${GITHUB_REF_NAME#v}" 1800

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md" --generate-notes
